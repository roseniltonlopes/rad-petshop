<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Patinhas & Cia · Agenda</title>
  <meta name="description" content="Agenda de atendimentos do pet shop Patinhas & Cia: protótipo RAD com SQLite e ViaCEP.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <div class="marca">
      <span class="logo" aria-hidden="true">🐾</span>
      <h1>Patinhas &amp; Cia</h1>
      <p>Agenda de atendimentos · Seg a Sáb, 08h às 18h · intervalos de 30 min</p>
    </div>
    <div class="acoes">
      <button type="button" class="btn ghost" id="btnBaixarDb">Baixar .db</button>
      <button type="button" class="btn ghost" id="btnBaixarLog">Baixar log</button>
    </div>
  </header>

  <form id="formulario" class="cartao" novalidate autocomplete="off">
    <div class="cabecalho">
      <h2 id="tituloFormulario">Novo agendamento</h2>
      <div class="acoes">
        <button type="submit" class="btn primario" id="btnCadastrar">Cadastrar</button>
        <button type="button" class="btn" id="btnAtualizar" disabled>Salvar alterações</button>
        <button type="button" class="btn perigo" id="btnExcluir" disabled>Excluir</button>
        <button type="button" class="btn ghost" id="btnLimpar">Limpar / Novo</button>
      </div>
    </div>

    <div class="blocos">
      <fieldset>
        <legend>Pet e tutor</legend>
        <label>Nome do pet *<input id="pet" maxlength="60"></label>
        <label>Tutor *<input id="tutor" maxlength="80"></label>
        <label>Telefone (DDD + número) *<input id="telefone" inputmode="tel" maxlength="16" placeholder="(11) 91234-5678"></label>
      </fieldset>

      <fieldset>
        <legend>Endereço do tutor</legend>
        <div class="linha">
          <label class="largo">CEP *<input id="cep" inputmode="numeric" maxlength="9" placeholder="00000-000"></label>
          <button type="button" class="btn" id="btnBuscarCep">Buscar CEP</button>
        </div>
        <label class="marcador"><input type="checkbox" id="enderecoManual"> Inserir endereço manualmente (ViaCEP fora do ar)</label>
        <div class="linha">
          <label class="largo">Logradouro *<input id="logradouro" readonly></label>
          <label>Número *<input id="numero" maxlength="20"></label>
        </div>
        <div class="linha">
          <label class="largo">Bairro *<input id="bairro" readonly></label>
          <label>Cidade/UF *<input id="cidade_uf" readonly></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Atendimento</legend>
        <label>Serviço *<select id="servico"></select></label>
        <label>Data *<input type="date" id="data"></label>
        <label>Horário disponível *<select id="hora"></select></label>
        <p class="dica" id="avisoHorarios" aria-live="polite"></p>
      </fieldset>
    </div>
  </form>

  <section class="cartao agenda">
    <div class="cabecalho">
      <div class="abas" role="tablist">
        <button type="button" class="aba ativa" role="tab" aria-selected="true" data-painel="painelAgenda">Agenda</button>
        <button type="button" class="aba" role="tab" aria-selected="false" data-painel="painelLog">Log de auditoria</button>
      </div>
      <span class="contador" id="contador"></span>
    </div>

    <div class="painel" id="painelAgenda">
      <div class="filtros">
        <label>Dia<select id="filtroDia"></select></label>
        <label>Mês<select id="filtroMes"></select></label>
        <label>Ano<select id="filtroAno"></select></label>
        <label class="largo">Buscar<input type="search" id="filtroBusca" placeholder="Cliente, pet, telefone, serviço, bairro ou cidade"></label>
        <button type="button" class="btn ghost" id="btnLimparFiltros">Limpar filtros</button>
      </div>
      <div class="rolagem">
        <table>
          <thead>
            <tr>
              <th>ID</th><th>Pet</th><th>Tutor</th><th>Telefone</th><th>CEP</th><th>Logradouro</th>
              <th>Nº</th><th>Bairro</th><th>Cidade/UF</th><th>Serviço</th><th>Data</th><th>Horário</th>
            </tr>
          </thead>
          <tbody id="tabela"></tbody>
        </table>
        <p class="vazio" id="vazio" hidden></p>
      </div>
    </div>

    <div class="painel" id="painelLog" hidden>
      <pre class="rolagem log" id="log"></pre>
    </div>
  </section>

  <dialog id="dialogo">
    <form method="dialog">
      <h3 id="dialogoTitulo"></h3>
      <p id="dialogoTexto"></p>
      <div class="acoes fim">
        <button value="nao" class="btn ghost" id="dialogoNao">Cancelar</button>
        <button value="sim" class="btn primario" id="dialogoSim">OK</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
  <script src="app.js"></script>
</body>
</html>
